<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.5/css/bootstrap.min.css">
    <link rel="stylesheet" href="/moongrader/vendor/css/material-design-iconic-font.min.css">
    <link rel="stylesheet" href="/moongrader/vendor/css/re-com.css">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700,400italic" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Roboto+Condensed:400,300" rel="stylesheet" type="text/css">
    <title>MoonGrader</title>
    <!-- Phones narrower than the 400px board get a 430px-wide layout that the browser scales to fit, so the
         pixel-tuned board/rings/buttons never need to change size. -->
    <script>if (Math.min(screen.width, screen.height) < 430) document.querySelector('meta[name=viewport]').setAttribute('content', 'width=430');</script>
    <!-- The ring rows are 1000px-wide boxes. Clip them at #app (made the positioned ancestor of the board, at the
         same top-left as the page) so they can't add a scrollbar or make phones zoom out to fit them. -->
    <style>
      #app { position: relative; overflow: hidden; min-height: 940px; }
      @supports (overflow-x: clip) { #app { overflow: visible; overflow-x: clip; min-height: 0; } }
    </style>
  </head>
  <body>
    <noscript>
      my-app2 is a JavaScript app. Please enable JavaScript to continue.
    </noscript>
    <div id="app"></div>
    <script src="/moongrader/js/compiled/app.js"></script>
  </body>
</html>
